services:
  - type: web
    name: snooker-score-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDB__ConnectionString
        sync: false
      - key: MongoDB__DatabaseName
        value: SnookerScorePlatform
      - key: Jwt__Secret
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
